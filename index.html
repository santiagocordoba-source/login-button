<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login with GitHub</title>
  <style>
    .github-button {
      /* Cambia el modo de visualización para poder centrarlo fácilmente */
      display: block;

      /* Agrega 25px de espacio arriba y centra el botón horizontalmente */
      margin: 25px auto 0 auto;

      /* Color de fondo gris oscuro estilo GitHub */
      background-color: #24292E;

      /* Color del texto en blanco */
      color: #FFFFFF;

      /* Elimina el borde gris por defecto */
      border: none;

      /* Mantiene las esquinas rectas */
      border-radius: 0px;

      /* Espacio interno alrededor del texto */
      padding: 16px 32px;

      /* Tipo de letra limpio */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;

      /* Tamaño del texto */
      font-size: 20px;

      /* Grosor normal del texto */
      font-weight: 400;

      /* Cambia el cursor a una mano al pasar por encima */
      cursor: pointer;
    }

    .github-button:hover {
      /* Aclara un poco el fondo al pasar el ratón */
      background-color: #2F363D;
    }
  </style>
</head>
<body>

  <!-- Botón en la página -->
  <button class="github-button">Log in with GitHub</button>

</body>
</html>
